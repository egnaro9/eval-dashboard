name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The audit step below is ungated on purpose, but a gate nothing triggers
  # cannot go red. Without this, a newly published advisory against an
  # already-pinned dependency goes unnoticed until somebody happens to push,
  # so "CI fails if that stops being true" was a claim about a check that
  # could not fire. Weekly, Monday 07:00 UTC.
  schedule:
    - cron: "0 7 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Audit (enforced; the README claims zero, so CI must be able to fail)
        run: npm audit --audit-level=moderate
      - name: Build (static export; also type-checks)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # The Dockerfile had never been built by CI. Listing "Docker" as a skill
  # invites a reader to run `docker build` — so it has to work, and something
  # other than hope has to say so.
  docker:
    name: the image actually builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t eval-dashboard:ci .
      - name: It serves the exported site
        run: |
          docker run -d --name dash -p 3000:3000 eval-dashboard:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' http://localhost:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs dash
          [ "$code" = "200" ] || { echo "::error::image served $code"; exit 1; }
          grep -qi "eval" /tmp/page.html || { echo "::error::served a page, but not the dashboard"; exit 1; }
          docker rm -f dash
